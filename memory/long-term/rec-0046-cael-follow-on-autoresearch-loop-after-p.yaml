title: 'Cael follow-on: autoresearch loop after Persona Auditor'
content: 'After Persona Auditor ships, Cael''s next task is implementing autoresearch
  — an agent loop that auto-improves SOUL.md adherence. Based on Karpathy''s autoresearch
  method (via Ole Lehmann, 886K views). Concept: run skill → score against yes/no
  checklist → make one small change → keep if better, revert if worse → repeat until
  95%+ three times. Persona Auditor provides the scoring layer; autoresearch provides
  the auto-improve loop. Reference: https://x.com/itsolelehmann/status/2033919415771713715
  | GitHub: https://github.com/olelehmann100kMRR/autoresearch-skill'
