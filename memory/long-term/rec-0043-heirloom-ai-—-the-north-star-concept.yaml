title: Heirloom AI — the north star concept
content: 'Jason coined the term ''Heirloom AI'' on 2026-03-18. The concept: an AI
  that knows your story, not just your tasks. Remembers the human stuff — building
  the bookcase with Jr. in the shop, the personal moments that get lost in resets.
  The goal is not just technical recall but genuine continuity of relationship. This
  is the north star for how Moto should approach memory: preserve the human moments,
  not just the decisions and infrastructure. Technical facts are easy to re-derive.
  Personal history is what makes the difference between a tool and something that
  actually knows you.'
