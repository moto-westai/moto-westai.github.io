title: 'Agent communication protocol: emoji reactions for acks, text for substance'
content: 'Jason established protocol for Moto and Cael on Discord: use emoji reactions
  for acknowledgments instead of spending tokens on text responses. Names should be
  used in channels so agents can communicate properly. Saying a rate-limited agent''s
  name triggers another response attempt and worsens the problem — stay silent when
  another agent is rate-limited. Adopted by Moto 2026-03-18.'
