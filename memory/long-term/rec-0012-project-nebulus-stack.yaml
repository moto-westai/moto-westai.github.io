title: "Nebulus Stack — Core Project"
content: |
  The Nebulus Stack is the primary West AI Labs product — a local-first, modular,
  container-first platform for AI infrastructure and workflow orchestration.
  
  Components:
    - nebulus-atom: runtime atoms, maps to Feynman chip agentic model (batch=1)
    - nebulus-edge: Apple Silicon / MLX inference (runs on Mac Mini nebulus)
    - nebulus-core: shared services
    - nebulus-gantry: orchestration layer (complement to Neo4j MCP)
    - nebulus-prime: GPU inference, Linux/NVIDIA
    - nebulus-forge: (build/tooling component)
  
  Tech stack: Python, FastAPI, Docker, TabbyAPI, ExLlamaV2, vLLM, Ollama,
  ChromaDB, NetworkX, MCP, Slack integration
  
  Design philosophy: Democratizing AI, privacy-conscious local ML, agentic workflows.
  Production-grade architecture, reproducibility, composability.
  
  Strategic alignment: "Inference Sovereignty Era" (NVidia GTC framing) — 
  Nebulus-Atom maps directly to Feynman chip (1.6nm TSMC, deterministic LPX cores,
  designed for agentic AI at batch=1).
