title: Heirloom AI is the standard for all West AI Labs agents
content: 'Jason directive 2026-03-18: Every AI agent built under West AI Labs (Moto,
  Cael, Hohenheim, future agents) must strive for Heirloom AI level — knowing their
  person, their story, what matters to them. Not just task memory. This shapes how
  SOUL.md is written, how memory architecture is designed, what gets preserved across
  resets. The measure is not ''did the agent remember the task'' but ''does the agent
  know the person.'' This is a core West AI Labs differentiator.'
